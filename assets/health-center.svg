<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Barangay health center on a sunny day">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#b7ddf7"/>
      <stop offset="0.45" stop-color="#cfebfb"/>
      <stop offset="0.78" stop-color="#eaf6fe"/>
      <stop offset="1" stop-color="#f6fbff"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="0.6" stop-color="#f0ebdf"/>
      <stop offset="1" stop-color="#e3dccd"/>
    </linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e2d4"/>
      <stop offset="1" stop-color="#d8d0bf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#9dc7e4"/>
      <stop offset="0.55" stop-color="#c2ddf0"/>
      <stop offset="1" stop-color="#e0eff8"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7eaacb"/>
      <stop offset="1" stop-color="#b6d2e5"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe7de"/>
      <stop offset="1" stop-color="#c6d3c7"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3573"/>
      <stop offset="1" stop-color="#0a2a63"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fff6dc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#eef7ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5f8fd" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="900" height="1200" fill="url(#sky)"/>
  <circle cx="725" cy="150" r="250" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.72">
    <ellipse cx="190" cy="150" rx="110" ry="34"/>
    <ellipse cx="255" cy="135" rx="80" ry="28"/>
    <ellipse cx="135" cy="138" rx="62" ry="22"/>
    <ellipse cx="640" cy="304" rx="120" ry="30"/>
    <ellipse cx="700" cy="290" rx="78" ry="24"/>
    <ellipse cx="580" cy="292" rx="62" ry="20"/>
  </g>
  <g fill="#ffffff" opacity="0.4">
    <ellipse cx="360" cy="92" rx="150" ry="26"/>
    <ellipse cx="470" cy="82" rx="90" ry="20"/>
  </g>

  <!-- distant trees -->
  <g opacity="0.55" filter="url(#soft2)">
    <circle cx="70" cy="620" r="95" fill="#7ba583"/>
    <circle cx="120" cy="585" r="70" fill="#6d9877"/>
    <circle cx="855" cy="600" r="110" fill="#7aa383"/>
    <circle cx="800" cy="650" r="78" fill="#6b9475"/>
    <rect x="36" y="650" width="18" height="120" fill="#7d6d57"/>
    <rect x="838" y="640" width="20" height="130" fill="#7d6d57"/>
  </g>

  <!-- palm fronds -->
  <g filter="url(#soft2)" opacity="0.9">
    <g transform="translate(60 470) rotate(-18)">
      <path d="M0 0C40-30 92-36 138-20 96-8 50 2 0 0Z" fill="#5f8a68"/>
      <path d="M0 0C34 22 76 36 122 34 82 56 36 48 0 0Z" fill="#6d9975"/>
      <path d="M0 0C-4-42 16-82 52-108 42-62 28-24 0 0Z" fill="#587f61"/>
    </g>
    <g transform="translate(860 430) scale(-1 1) rotate(-14)">
      <path d="M0 0C40-30 92-36 138-20 96-8 50 2 0 0Z" fill="#5f8a68"/>
      <path d="M0 0C34 22 76 36 122 34 82 56 36 48 0 0Z" fill="#6d9975"/>
      <path d="M0 0C-4-42 16-82 52-108 42-62 28-24 0 0Z" fill="#587f61"/>
    </g>
  </g>

  <!-- building shadow / ground -->
  <ellipse cx="450" cy="1000" rx="400" ry="54" fill="#9fb2a1" opacity="0.35"/>

  <!-- building -->
  <g>
    <!-- side wings -->
    <rect x="132" y="606" width="120" height="360" fill="url(#wallShade)" rx="4"/>
    <rect x="648" y="606" width="120" height="360" fill="url(#wallShade)" rx="4"/>
    <rect x="132" y="606" width="120" height="14" fill="#d4cbb9"/>
    <rect x="648" y="606" width="120" height="14" fill="#d4cbb9"/>

    <!-- main block -->
    <rect x="196" y="520" width="508" height="446" fill="url(#wall)"/>
    <rect x="196" y="520" width="508" height="12" fill="#fffdf7" opacity="0.8"/>

    <!-- roof -->
    <rect x="170" y="486" width="560" height="40" rx="6" fill="#ded5c4"/>
    <rect x="170" y="486" width="560" height="12" rx="6" fill="#efe8da"/>
    <rect x="186" y="470" width="528" height="22" rx="6" fill="#cfc5b2"/>

    <!-- floor divider -->
    <rect x="196" y="700" width="508" height="10" fill="#ded5c4" opacity="0.85"/>

    <!-- upper windows -->
    <g>
      <rect x="238" y="566" width="112" height="106" rx="4" fill="url(#glass)" stroke="#ffffff" stroke-width="7"/>
      <rect x="394" y="566" width="112" height="106" rx="4" fill="url(#glass)" stroke="#ffffff" stroke-width="7"/>
      <rect x="550" y="566" width="112" height="106" rx="4" fill="url(#glass)" stroke="#ffffff" stroke-width="7"/>
      <path d="M238 620h112M394 620h112M550 620h112" stroke="#ffffff" stroke-width="5" opacity="0.85"/>
      <path d="M294 566v106M450 566v106M606 566v106" stroke="#ffffff" stroke-width="5" opacity="0.85"/>
      <!-- reflections -->
      <path d="M250 660l40-80 20 0-46 80Z" fill="#ffffff" opacity="0.18"/>
      <path d="M406 660l40-80 20 0-46 80Z" fill="#ffffff" opacity="0.18"/>
      <path d="M562 660l40-80 20 0-46 80Z" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- AC units -->
    <g fill="#d9d2c3" stroke="#c5bcaa" stroke-width="2">
      <rect x="256" y="688" width="52" height="10" rx="3"/>
      <rect x="412" y="688" width="52" height="10" rx="3"/>
      <rect x="568" y="688" width="52" height="10" rx="3"/>
    </g>

    <!-- sign band -->
    <rect x="212" y="716" width="476" height="66" rx="4" fill="url(#band)"/>
    <text x="450" y="745" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="3.5" fill="#ffffff">CITY HEALTH CENTER 1</text>
    <text x="450" y="767" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#b7cce8">BARANGAY BAYUGO</text>

    <!-- ground floor -->
    <g>
      <rect x="222" y="798" width="120" height="150" rx="4" fill="url(#glassDark)" stroke="#ffffff" stroke-width="6"/>
      <rect x="558" y="798" width="120" height="150" rx="4" fill="url(#glassDark)" stroke="#ffffff" stroke-width="6"/>
      <path d="M222 852h120M558 852h120" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
      <path d="M262 798v150M322 798v150M598 798v150M638 798v150" stroke="#ffffff" stroke-width="4" opacity="0.7"/>

      <!-- entrance -->
      <rect x="366" y="804" width="168" height="144" rx="4" fill="#8fb9d6" stroke="#ffffff" stroke-width="6"/>
      <rect x="446" y="804" width="8" height="144" fill="#ffffff" opacity="0.85"/>
      <rect x="376" y="816" width="60" height="120" fill="#ffffff" opacity="0.12"/>
      <rect x="462" y="816" width="60" height="120" fill="#ffffff" opacity="0.12"/>

      <!-- canopy -->
      <rect x="342" y="782" width="216" height="18" rx="4" fill="#b3122f"/>
      <rect x="342" y="782" width="216" height="6" rx="3" fill="#d4304b"/>
    </g>

    <!-- steps -->
    <rect x="330" y="948" width="240" height="14" rx="2" fill="#d8d1c2"/>
    <rect x="314" y="962" width="272" height="14" rx="2" fill="#cfc7b7"/>

    <!-- planters -->
    <g>
      <rect x="236" y="930" width="44" height="24" rx="4" fill="#b7ad9b"/>
      <circle cx="258" cy="918" r="20" fill="#6f9a72"/>
      <rect x="620" y="930" width="44" height="24" rx="4" fill="#b7ad9b"/>
      <circle cx="642" cy="918" r="20" fill="#6f9a72"/>
    </g>

    <!-- flag pole -->
    <rect x="716" y="540" width="4" height="410" fill="#b9b2a3"/>
    <path d="M720 552h54v30h-54Z" fill="#0a2a63"/>
    <path d="M720 552h54v10h-54Z" fill="#c8102e"/>
  </g>

  <!-- ground -->
  <path d="M0 980h900v220H0Z" fill="url(#ground)"/>
  <path d="M0 980h900v10H0Z" fill="#eef2e9" opacity="0.7"/>

  <!-- foreground hedge (blurred) -->
  <g filter="url(#soft)" opacity="0.95">
    <circle cx="40" cy="1050" r="110" fill="#56805f"/>
    <circle cx="150" cy="1085" r="92" fill="#4c7456"/>
    <circle cx="860" cy="1040" r="130" fill="#56805f"/>
    <circle cx="742" cy="1090" r="94" fill="#4c7456"/>
    <ellipse cx="450" cy="1155" rx="360" ry="86" fill="#4f7a59"/>
  </g>

  <!-- soft light haze -->
  <rect width="900" height="1200" fill="url(#haze)"/>
  <path d="M0 1200V995c120-26 240 12 360-6s240-52 360-30 180 34 180 34v207Z" fill="#f7fbff" opacity="0.16"/>
</svg>
